<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medieval Marketplace</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .site-window {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .wix-site {
            position: absolute;

            /* Move the Wix page upward to hide the 30px Wix banner */
            top: -30px;
            left: 0;

            /*
             * Make the iframe slightly wider than the visible window.
             * This pushes the Wix scrollbar off-screen so it gets clipped.
             */
            width: calc(100% + 20px);

            /*
             * Add the cropped 30px back at the bottom
             * so the Wix site still fills the whole screen.
             */
            height: calc(100% + 30px);

            border: 0;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="site-window">
        <iframe
            class="wix-site"
            src="https://tabletopwarehouse.wixstudio.com/my-site-1"
            title="Medieval Marketplace"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
